[package]
name = "sample_crate_pyo3"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
rustcall_julia_macros = { path = "../../../deps/rustcall_julia_macros" }
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

[features]
default = []
# Enable Python bindings
python = ["pyo3"]
