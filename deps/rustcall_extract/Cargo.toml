[package]
name = "rustcall_extract"
version = "0.4.2"
edition = "2021"
description = "Extractor CLI for RustCall.jl: FFI manifests, inline expansion and generic specialization"
license = "MIT"
repository = "https://github.com/atelierarith/RustCall.jl"

[[bin]]
name = "rustcall-extract"
path = "src/main.rs"

[dependencies]
rustcall_core = { path = "../rustcall_core" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# `build.rs` embeds a digest of the sources this binary is built from
# (`rustcall-extract source-digest`, RustCall.jl #372).
[build-dependencies]
sha2 = "0.10"
toml = "0.8"
