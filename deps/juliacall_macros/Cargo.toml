[package]
name = "juliacall_macros"
version = "0.1.0"
edition = "2021"
description = "Proc macros for RustCall.jl - Julia-Rust FFI"
license = "MIT"
repository = "https://github.com/atelierarith/RustCall.jl"
keywords = ["julia", "ffi", "proc-macro"]
categories = ["development-tools::ffi"]
readme = "README.md"

[lib]
proc-macro = true

[features]
default = []
# Enable Python binding generation via PyO3
python = []

[dependencies]
rustcall_core = { path = "../rustcall_core" }
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
proc-macro2 = "1.0"

[dev-dependencies]
trybuild = "1.0"
# `#[julia]` must compose with other proc-macro attributes (#279); the
# regression example in examples/pyo3_compose.rs (compiled by `cargo test`) stacks it with `#[pyfunction]`.
# Only the macro machinery is needed, not the extension-module glue.
pyo3 = { version = "0.29", default-features = false, features = ["macros"] }
