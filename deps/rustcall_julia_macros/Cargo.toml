[package]
name = "rustcall_julia_macros"
version = "0.2.0"
edition = "2021"
description = "The #[julia] attribute and its runtime for RustCall.jl - Julia-Rust FFI"
license = "MIT"
repository = "https://github.com/atelierarith/RustCall.jl"
keywords = ["julia", "ffi", "proc-macro"]
categories = ["development-tools::ffi"]
readme = "README.md"

# Not a proc-macro crate any more (#304). A proc-macro crate is compiled for the
# host and linked into no `cdylib`, so it can carry only proc macros — and
# `#[julia]` needs one crate-wide item its wrappers can name: the quiet-panic
# boundary. That state lives in `src/rt.rs` here, the attribute itself is
# re-exported from `rustcall_julia_macros_impl`, and a crate that depends on
# `rustcall_julia_macros` (which every `#[julia]` crate already does) is
# unchanged.
[dependencies]
# Exact, not `^`: the attribute this crate re-exports generates references to
# the runtime items in this crate's `src/rt.rs`, which is generated by and
# tested against the core of the *same* version. A caret requirement would let
# a project holding this crate at 0.1.0 resolve a newer implementation whose
# output this runtime cannot satisfy (#451 review).
rustcall_julia_macros_impl = { path = "../rustcall_julia_macros_impl", version = "=0.2.0" }

[dev-dependencies]
trybuild = "1.0"
# `#[julia]` must compose with other proc-macro attributes (#279); the
# regression example in examples/pyo3_compose.rs (compiled by `cargo test`) stacks it with `#[pyfunction]`.
# Only the macro machinery is needed, not the extension-module glue.
pyo3 = { version = "0.29", default-features = false, features = ["macros"] }
