context_source = """
pub struct Pair<T>
where
    T: Clone,
{
    pub left: T,
    pub right: T,
}
impl<T> Pair<T>
where
    T: Clone,
{
    pub fn new(left: T, right: T) -> Self {
        Self { left, right }
    }
    pub fn first(&self) -> T {
        self.left.clone()
    }
    pub fn inline_only(&self) -> T {
        self.right.clone()
    }
}
"""
