name: Examples

# `Pkg.test()` of every Julia package under examples/, against the RustCall of
# this checkout. The example packages are what a user copies first, so a
# change that breaks `rust"""` in a package, `@rust_crate` from a package, or
# the written-bindings workflow (`write_bindings_to_file` + `deps/build.jl`)
# must fail CI here rather than be found by a reader.
#
# One job per package (the matrix), Ubuntu only: the platform matrix lives in
# CI.yml, and an example package exercises the front doors, not the platform.
#
# A second job runs the Pluto notebook `examples/pluto/hello.jl` headlessly
# with Pluto itself (`examples/pluto/run_notebook.jl`) and fails when any cell
# errors — a notebook is not a script, so a plain `julia hello.jl` would not
# evaluate it the way a reader sees it.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example:
    name: Example - ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Directory names under examples/ that are Julia packages (a
        # Project.toml with `name`). Add a new example package here.
        package:
          - MyExample.jl
          - SampleCrate.jl
          - SampleCratePyO3.jl
          - SampleCratePyO3Only.jl
          - RustCrateMacroPyO3Only.jl
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        # SampleCratePyO3Only.jl and RustCrateMacroPyO3Only.jl bind a PyO3-only
        # crate through RustCall's generated wrapper crate, and pyo3 is a
        # mandatory dependency of those crates, so the wrapper links libpython
        # (link plan `:link_libpython`): its build needs an interpreter whose
        # library directory RustCall can find. Install one before Julia runs
        # and pin it with PYO3_PYTHON below, rather than trusting whatever
        # `python3` the runner image has. Harmless for the other packages:
        # their crates never link Python.
        id: python
        with:
          python-version: '3.x'
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
          arch: x64
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: julia-actions/cache@v2
      - name: Develop this checkout's RustCall into the example and run its tests
        # `Pkg.develop(path=".")` makes the example use the RustCall of this
        # checkout (its compat allows it) and builds RustCall's helper library;
        # `Pkg.build()` runs the example's own deps/build.jl when it has one
        # (the written-bindings workflow); `Pkg.test()` is the check.
        env:
          # The interpreter pyo3 configures itself for and whose library
          # directory the wrapper links against (docs/src/pyo3.md, "Which
          # Python"). Only SampleCratePyO3Only.jl and
          # RustCrateMacroPyO3Only.jl read it.
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: >
          julia --color=yes --project=examples/${{ matrix.package }} -e '
            using Pkg
            Pkg.develop(path = ".")
            Pkg.build()
            Pkg.test()
          '

  pluto:
    name: Pluto - hello.jl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
          arch: x64
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: julia-actions/cache@v2
      - name: Instantiate and build this checkout's RustCall
        # The notebook's first cell does `Pkg.activate` on the repository root
        # and `using RustCall`, so the root environment must be instantiated
        # and RustCall's helper library built before the notebook runs.
        run: >
          julia --color=yes --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.build("RustCall")
          '
      - name: Run the notebook with Pluto and fail on any errored cell
        # examples/pluto/Project.toml provides Pluto; run_notebook.jl opens
        # hello.jl in a headless Pluto session, runs every cell in Pluto's own
        # worker process and exits non-zero when any cell errored.
        run: |
          julia --color=yes --project=examples/pluto -e 'using Pkg; Pkg.instantiate()'
          julia --color=yes --project=examples/pluto examples/pluto/run_notebook.jl
