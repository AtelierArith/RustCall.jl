name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

# A hosted runner's network to crates.io occasionally stalls or loses DNS for
# a minute (run 42189186825: `transfer too slow`, then `Could not resolve host:
# index.crates.io`, which failed a Cargo build inside `Pkg.test()` after
# Cargo's default three retries). Give every Cargo invocation in this workflow
# -- `Pkg.build`, the test suite's own crate builds, the Rust jobs -- more
# retries so one stalled transfer does not fail the run. `CARGO_NET_*` only
# says how Cargo talks to the network: it is not part of any artifact key
# (`ARTIFACT_BUILD_ENV_PREFIXES`) and keeps the extractor's build plain
# (`src/artifacts/extractor_identity.jl`), as `CARGO_NET_OFFLINE` does in
# OfflineTests.yml.
env:
  CARGO_NET_RETRY: '10'

jobs:
  lint:
    name: Code Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check string interpolation patterns
        run: bash scripts/lint_interpolation.sh src
      - name: Check that Julia does not parse Rust syntax with regexes
        run: bash scripts/lint_rust_syntax_regex.sh src
      - name: Check that artifact identity goes through src/artifacts/artifact_id.jl
        run: bash scripts/lint_artifact_identity.sh src
      - name: Check that loading and registration go through src/loading/loadpolicy.jl
        run: bash scripts/lint_load_path.sh src
      - name: Check that every FFI entry point takes one generation snapshot
        run: bash scripts/lint_generation_snapshot.sh src
      - name: Check that mutable registries use the Lockable state container
        run: bash scripts/lint_state_container.sh src

  rust-tests:
    name: Rust ${{ matrix.rust }} - ${{ matrix.os }} - ${{ matrix.crate }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - beta
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        crate:
          - rustcall_julia_core
          - rustcall_extract
          - rustcall_julia_macros
          - rustcall_julia_macros_impl
          - rustcall_helpers
    defaults:
      run:
        working-directory: deps/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      # Cache ~/.cargo and each crate's `target`, keyed by the lockfile and
      # rustc version. The crates share syn/quote/proc-macro2, so a cold
      # `cargo test` spends most of its time compiling dependencies.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: deps/${{ matrix.crate }} -> target
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-features

  test:
    # Linux keeps its historical required status check name. Windows and
    # macOS required checks below aggregate the matrix results.
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            version: '1'
            test_args: --jobs=4
            threads: '1'
            suffix: ''
          - os: windows-latest
            arch: x64
            version: '1'
            test_args: --jobs=2
            threads: '1'
            suffix: ' - shard 1'
            shard: '1'
          - os: windows-latest
            arch: x64
            version: '1'
            test_args: --jobs=2
            threads: '1'
            suffix: ' - shard 2'
            shard: '2'
          - os: macos-latest
            arch: aarch64
            version: '1'
            test_args: --jobs=2
            threads: '1'
            suffix: ' - shard 1'
            shard: '1'
          - os: macos-latest
            arch: aarch64
            version: '1'
            test_args: --jobs=2
            threads: '1'
            suffix: ' - shard 2'
            shard: '2'
          # A multithreaded run. Several properties this package guarantees are
          # only *exercised* with more than one thread: the panic channel is a
          # thread-local, so its "the wrapper call and the channel read happen
          # on one thread" rule is invisible single-threaded (#244); so is
          # `load_artifact!`'s behaviour when two tasks load the same path
          # (#277), and finalizers running on a thread that is not the one
          # that allocated (#249). The affected testsets skip themselves when
          # `Threads.nthreads() < 2`, so without this entry they would never
          # run anywhere.
          - os: ubuntu-latest
            arch: x64
            version: '1'
            test_args: --jobs=2
            threads: '4'
            suffix: ' - 4 threads - shard 1'
            shard: '1'
          - os: ubuntu-latest
            arch: x64
            version: '1'
            test_args: --jobs=2
            threads: '4'
            suffix: ' - 4 threads - shard 2'
            shard: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # `deps/build.jl` (via julia-buildpkg) runs `cargo build --release
      # --locked` for the helpers library and the extractor. Without a Cargo
      # cache every run recompiles their whole dependency graph; cache it, and
      # put a `rustc` on PATH so `RustToolChain` uses it rather than downloading
      # its artifact. The toolchain is installed *before* the cache action,
      # which keys on `rustc -vV` and on every Cargo.lock in the tree.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            deps/rustcall_helpers -> target
            deps/rustcall_extract -> target
      # Cargo 1.100's longer build paths exceed MAX_PATH under the Windows
      # user temp directory once the test-only Scratch depot is prepended.
      - name: Use a short Windows temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: julia-actions/julia-buildpkg@v1
      - name: Bounds-checked state and mixed reload stress
        if: matrix.threads == '4' && matrix.shard == '1'
        env:
          RUSTCALL_EXTRACT: ${{ github.workspace }}/deps/rustcall_extract/target/release/rustcall-extract
        run: |
          julia --threads=4 --check-bounds=yes --project test/test_state.jl
          julia --threads=4 --check-bounds=yes --project test/test_hot_reload_transaction.jl
          julia --threads=4 --check-bounds=yes --project test/test_generic_reload.jl
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads }}
          RUSTCALL_CI_SHARD: ${{ matrix.shard }}
        with:
          test_args: ${{ matrix.test_args }}

  windows-required:
    # Preserve the ruleset's historical required check, and fail it if any
    # matrix job fails or is cancelled, including either Windows shard.
    name: Julia 1 - windows-latest - x64
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.test.result }}' = success

  macos-required:
    # Preserve the historical required status check across both macOS shards.
    name: Julia 1 - macos-latest - aarch64
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.test.result }}' = success

  compile-benchmark:
    name: Compile benchmark - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: dtolnay/rust-toolchain@stable
      - uses: julia-actions/cache@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            deps/rustcall_helpers -> target
            deps/rustcall_extract -> target
      - uses: julia-actions/julia-buildpkg@v1
      - name: Build the release extractor
        working-directory: deps/rustcall_extract
        run: cargo build --release
      - name: Run cold and warm compile benchmark
        shell: bash
        env:
          RUSTCALL_EXTRACT: ${{ github.workspace }}/deps/rustcall_extract/target/release/rustcall-extract${{ runner.os == 'Windows' && '.exe' || '' }}
        run: julia --project=benchmark benchmark/benchmarks_compile.jl | tee benchmark-${{ runner.os }}.txt
      - name: Publish benchmark result
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ runner.os }}"
            cat benchmark-${{ runner.os }}.txt
          } >> "$GITHUB_STEP_SUMMARY"
