# The Rust half of examples/SafeLedger.jl: a facade crate. Everything the Julia
# side can see is in src/lib.rs under `#[julia]`; the state behind it (a
# HashMap) never crosses the boundary. See docs/src/integration_guide.md.
#
# `rustcall_julia_macros` (the `#[julia]` attribute) is on crates.io, but this
# example takes it by path from the RustCall.jl checkout, so that it is tested
# with the attribute of the same tree as the RustCall it runs against. It is
# the only reference this example makes outside its own directory; a crate of
# your own can depend on the release instead (`rustcall_julia_macros = "0.4"`).
[package]
name = "safe_ledger"
version = "0.1.0"
edition = "2021"
description = "The Rust half of examples/SafeLedger.jl: an opaque-handle facade bound with @rust_crate"

[lib]
crate-type = ["cdylib"]

[dependencies]
rustcall_julia_macros = { path = "../../../../deps/rustcall_julia_macros" }
