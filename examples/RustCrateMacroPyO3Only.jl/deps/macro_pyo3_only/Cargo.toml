# A crate written for PyO3 only: it knows nothing about RustCall, carries no
# RustCall attribute anywhere, does not depend on `rustcall_julia_macros`, and
# uses no `pub`. It is a **real extension module**: `cdylib` (no `rlib`) and
# pyo3's `extension-module`, the build that leaves libpython's symbols to the
# interpreter that loads it. RustCall binds it as is (#424) by building the
# crate itself and importing it. Nothing in this directory changes for Julia's
# sake.
[package]
name = "macro_pyo3_only"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", default-features = false, features = ["macros", "extension-module"] }
