# A crate written for PyO3 only: it knows nothing about RustCall, carries no
# RustCall attribute anywhere, and does not depend on `rustcall_julia_macros`.
# It is a **real extension module**: `cdylib` (no `rlib`) and pyo3's
# `extension-module` feature, the build that leaves libpython's symbols to the
# interpreter that loads it. RustCall binds it as is (#424): it builds the crate
# itself — the `extension-module` build the C-ABI wrapper path calls
# `:unlinkable` — imports it through PythonCall, and calls it. Nothing in this
# directory changes for Julia's sake.
[package]
name = "sample_crate_pyo3_only"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", default-features = false, features = ["macros", "extension-module"] }
